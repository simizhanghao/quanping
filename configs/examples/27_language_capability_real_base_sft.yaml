# P3-F-D real Base↔SFT multilingual capability matrix (3+1).
#
# Prerequisites:
#   1) python scripts/prepare_language_real_subset.py --from-hf --n 64
#   2) scripts/run_mc_offline_predict.py for base + sft on each cell
#   3) then: language-matrix-offline this config
#
# Paths assume data/language_pack_real/ layout from the prepare script.
run_id: language_capability_real_base_sft
packs: [language]
task_spec: ../../examples/toy_indommlu/task.yaml
output_spec: ../../examples/toy_indommlu/output.yaml
metric_spec: ../../examples/toy_indommlu/metrics.yaml
parse:
  mode: from_parsed
report:
  primary_target: answer
  primary_metric: accuracy
compare:
  target: answer
  denominator: semantic
statistics:
  enabled: true
  n_bootstrap: 500
  confidence_level: 0.95
  seed: 42
  bootstrap_unit: sample
  metrics: [accuracy]
capabilities:
  reading_comprehension:
    adapter: belebele_jsonl
    languages:
      ind:
        samples: ../../data/language_pack_real/belebele/ind_Latn.jsonl
        benchmark_id: belebele_ind_Latn
        baseline:
          predictions: ../../data/language_pack_real/predictions/base/belebele_ind_Latn.jsonl
        candidate:
          predictions: ../../data/language_pack_real/predictions/sft/belebele_ind_Latn.jsonl
      eng:
        samples: ../../data/language_pack_real/belebele/eng_Latn.jsonl
        benchmark_id: belebele_eng_Latn
        baseline:
          predictions: ../../data/language_pack_real/predictions/base/belebele_eng_Latn.jsonl
        candidate:
          predictions: ../../data/language_pack_real/predictions/sft/belebele_eng_Latn.jsonl
  local_knowledge:
    adapter: indommlu_jsonl
    languages:
      ind:
        samples: ../../data/language_pack_real/indommlu/samples.jsonl
        benchmark_id: indommlu
        answer_encoding: letter
        baseline:
          predictions: ../../data/language_pack_real/predictions/base/indommlu.jsonl
        candidate:
          predictions: ../../data/language_pack_real/predictions/sft/indommlu.jsonl
  cultural_reasoning:
    adapter: copal_jsonl
    languages:
      ind:
        samples: ../../data/language_pack_real/copal_id/samples.jsonl
        benchmark_id: copal_id
        answer_encoding: zero_based_index
        baseline:
          predictions: ../../data/language_pack_real/predictions/base/copal_id.jsonl
        candidate:
          predictions: ../../data/language_pack_real/predictions/sft/copal_id.jsonl
gates:
  - id: target_ind_reading_min_gain
    path: language_regression.by_capability.reading_comprehension.by_language.ind.delta
    op: ">="
    value: -0.02
  - id: control_eng_reading_max_drop
    path: language_regression.by_capability.reading_comprehension.by_language.eng.delta
    op: ">="
    value: -0.05
  - id: target_ind_reading_ci_lower
    path: language_regression.by_capability.reading_comprehension.by_language.ind.delta_ci_low
    op: ">="
    value: -0.05
    requirements:
      min_samples: 50
  - id: control_eng_reading_ci_lower
    path: language_regression.by_capability.reading_comprehension.by_language.eng.delta_ci_low
    op: ">="
    value: -0.08
    requirements:
      min_samples: 50
output_dir: results/27_language_capability_real_base_sft
