run_id: robustness_toy_invariance
packs: [robustness]
source:
  samples: ../../examples/toy_metamorphic_intent/samples.jsonl
  predictions: ../../examples/toy_metamorphic_intent/predictions_clean.jsonl
  variants: ../../examples/toy_metamorphic_intent/variants.jsonl
  variant_predictions: ../../examples/toy_metamorphic_intent/predictions_variant.jsonl
task_spec: ../../examples/toy_metamorphic_intent/task.yaml
output_spec: ../../examples/toy_metamorphic_intent/output.yaml
metric_spec: ../../examples/toy_metamorphic_intent/metrics.yaml
parse:
  mode: from_parsed
relation:
  type: invariance
  targets:
    - intent_class
bootstrap:
  n_boot: 200
  seed: 42
  cluster_path: sample
output_dir: results/15_robustness_toy_invariance
