run_id: compare_base_sft_toy_intent
packs: [compare, business]
samples: ../../examples/toy_compare_intent/samples.jsonl
baseline:
  source:
    adapter: jsonl
    samples: ../../examples/toy_compare_intent/samples.jsonl
    predictions: ../../examples/toy_compare_intent/baseline_predictions.jsonl
candidate:
  source:
    adapter: jsonl
    samples: ../../examples/toy_compare_intent/samples.jsonl
    predictions: ../../examples/toy_compare_intent/candidate_predictions.jsonl
task_spec: ../../examples/toy_compare_intent/task.yaml
output_spec: ../../examples/toy_compare_intent/output.yaml
metric_spec: ../../examples/toy_compare_intent/metrics.yaml
parse:
  mode: from_parsed
compare:
  target: intent_class
  denominator: semantic
  display:
    baseline: Base
    candidate: SFT
comparability:
  semantic:
    prompt_protocol: toy_intent_v1
    context_protocol: single_turn
    scoring_protocol: linguaeval_offline_v1
  baseline:
    backend_family: offline_fixture
    decoding: {temperature: 0.0}
  candidate:
    backend_family: offline_fixture
    decoding: {temperature: 0.0}
report:
  primary_target: intent_class
  primary_metric: accuracy
statistics:
  enabled: true
  n_bootstrap: 200
  confidence_level: 0.95
  seed: 42
  bootstrap_unit: sample
  metrics: [accuracy, macro_f1]
slices:
  enabled: true
  min_support: 1
  specs:
    - name: language
      source: meta.language
    - name: gold_label
      source: target.gold
    - name: input_length
      source: input.text.length
      buckets: [12, 20, 100000]
      labels: [short, medium, long]
gates:
  - id: candidate_accuracy_min
    path: candidate_business.primary.value
    op: ">="
    value: 0.5
  - id: delta_accuracy_min
    path: metric_deltas.metrics.accuracy.delta
    op: ">="
    value: 0
  # Demonstrates P1-D: tiny n must not FAIL a CI gate
  - id: delta_accuracy_ci_lower
    path: statistics.metrics.accuracy.delta.ci_low
    op: ">="
    value: 0
    requirements:
      min_samples: 500
output_dir: results/05_compare_base_sft_toy
